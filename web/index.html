<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Giữ Xe">
  <title>Giữ Xe Gò Mây</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/print.css">
  <script src="vendor/jsQR.js"></script>
  <script src="vendor/qrcode-generator.js"></script>
</head>
<body>
  <header id="topbar" hidden>
    <div class="counters">
      <span id="count-in-lot">Trong bãi: 0</span>
      <span id="count-pending" class="muted">Chờ đồng bộ: 0</span>
      <span id="count-photos" class="muted">Ảnh chờ sao lưu: 0</span>
      <span id="storage-warn" class="warn-text" hidden></span>
      <span id="net-status" class="muted"></span>
    </div>
    <nav id="nav"></nav>
  </header>
  <main id="screen"></main>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
